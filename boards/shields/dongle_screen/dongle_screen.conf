# display + custom status screen
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_DONGLE_ROUND_SCREEN=y

# LVGL 9: RGB565, arc + label widgets, fonts used by the screen
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_36=y
CONFIG_LV_Z_VDB_SIZE=25
# ~40 objects (arcs, bars, chip logo, badge): 16 KB was tight, raise if the
# screen stays blank / the dongle resets right after boot
CONFIG_LV_Z_MEM_POOL_SIZE=24576

# data sources
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
