# Dongle on nice!nano / nRF52840 clone — USB powered central
CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Trackball / pointing from the right half
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# Display thread (GC9A01 is handled by dongle_screen shield)
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# USB-powered: higher TX power is free
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
